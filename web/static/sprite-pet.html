<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- no viewport meta / style.css link — both force opaque rasterization and defeat WebView2 transparency -->
<title>TinyRouter Pet</title>
<style>
  /* width/height 100%: vw/vh ignore body zoom (scale) and would crop */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* leave root background unset — transparent default shows desktop through DefaultBackgroundColor=0 */
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* 布局：单一宠物区(300*f)。气泡与输入行均锚定在精灵侧面（chat-left 时
     精灵靠右、气泡在左），窗口宽 = 300*f（见 host applyPetScale） */
  .pet-container {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    background: transparent;
    border: none;
  }
  #pet-area {
    position: relative;
    width: 300px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 8px;
    box-sizing: border-box;
    flex: none;
  }
  body.chat-left #pet-area { justify-content: flex-end; }
  /* 状态：容器透明；仅在 fallback（无 sheet）或有 sprite 时分别展现装饰 */
  .pet-avatar {
    width: 70px;
    height: 70px;
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    position: relative;
  }
  /* 有 spritesheet 时按需开启 bounce；默认无 sprite 时不跑动画 */
  .pet-avatar.has-sprite {
    animation: pet-bounce 2.5s ease-in-out infinite;
  }
  /* fallback（无 sprite）：仅头像容器呈现装饰，去除蓝紫渐变叠加 */
  .pet-avatar.no-sprite {
    background: var(--accent-gradient, linear-gradient(135deg, #4fc3f7, #7c4dff));
    border-radius: 50% 50% 45% 45%;
    box-shadow: 0 8px 24px rgba(79, 195, 247, 0.4);
  }
  .pet-avatar:active {
    cursor: grabbing;
  }
  .pet-face {
    position: relative;
    width: 46px;
    height: 36px;
  }
  .pet-eye {
    position: absolute;
    top: 8px;
    width: 7px;
    height: 9px;
    background: #0b0c13;
    border-radius: 50%;
  }
  .pet-eye.left { left: 9px; }
  .pet-eye.right { right: 9px; }
  .pet-blush {
    position: absolute;
    top: 17px;
    width: 9px;
    height: 5px;
    background: rgba(255, 105, 180, 0.7);
    border-radius: 50%;
  }
  .pet-blush.left { left: 5px; }
  .pet-blush.right { right: 5px; }
  .pet-mouth {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 5px;
    border-bottom: 2.5px solid #0b0c13;
    border-radius: 0 0 10px 10px;
  }
  .pet-bubble {
    position: absolute;
    left: 0;
    top: 0;
    max-width: 200px;
    background: var(--modal-bg, #1a1528);
    border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
    border-radius: 12px;
    padding: 8px 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  /* 输入行在气泡内：双击精灵显示，与回复气泡同一锚定位置 */
  .pet-input-row {
    display: none;
    gap: 4px;
    width: 100%;
  }
  .pet-input-row.show { display: flex; }
  .pet-bubble-text {
    font-size: 12px;
    color: var(--text, #fff);
    line-height: 1.3;
    max-height: 160px;
    overflow-y: auto;
  }
  .pet-bubble-input {
    flex: 1;
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--glass-border, rgba(255,255,255,0.2));
    border-radius: 6px;
    color: #fff;
    font-size: 11px;
    outline: none;
  }
  .pet-bubble-btn {
    padding: 2px 8px;
    background: var(--accent, #4fc3f7);
    color: #0b0c13;
    border: none;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  /* HTML context menu (right-click): close + scale */
  #pet-ctxmenu {
    display: none;
    position: absolute;
    z-index: 20;
    min-width: 150px;
    padding: 4px;
    background: rgba(250, 250, 250, 0.97);
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    font-size: 12px;
    color: #222;
  }
  #pet-ctxmenu.show { display: block; }
  #pet-ctxmenu .pet-menu-item {
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  #pet-ctxmenu .pet-menu-item:hover { background: rgba(79, 195, 247, 0.18); }
  #pet-ctxmenu .pet-menu-sep { height: 1px; background: rgba(0,0,0,0.1); margin: 4px; }
  #pet-ctxmenu .pet-scales { display: flex; gap: 3px; padding: 2px; }
  #pet-ctxmenu .pet-scale-item {
    flex: 1;
    text-align: center;
    padding: 5px 2px;
    border-radius: 5px;
    cursor: pointer;
  }
  #pet-ctxmenu .pet-scale-item:hover { background: rgba(79, 195, 247, 0.18); }
  #pet-ctxmenu .pet-scale-item.active { background: rgba(79, 195, 247, 0.3); font-weight: 600; }
  @keyframes pet-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
</style>
</head>
<body>
<div class="pet-container">
  <div id="pet-area">
    <div class="pet-avatar" id="pet-avatar" onclick="toggleBubble(event)">
      <canvas id="pet-sprite" width="70" height="70" style="display:none;image-rendering:pixelated;"></canvas>
      <div class="pet-face">
        <div class="pet-eye left"></div>
        <div class="pet-eye right"></div>
        <div class="pet-blush left"></div>
        <div class="pet-blush right"></div>
        <div class="pet-mouth"></div>
      </div>
    </div>
    <div id="pet-bubble" class="pet-bubble">
      <div id="pet-bubble-msg" class="pet-bubble-text">主人，我是桌面小精灵！</div>
      <div class="pet-input-row">
        <input type="text" id="pet-input" class="pet-bubble-input" placeholder="输入指令..." onkeydown="if(event.key==='Enter')sendPetIntent()">
        <button class="pet-bubble-btn" onclick="sendPetIntent()">执行</button>
      </div>
    </div>
  </div>
  <div id="pet-ctxmenu">
    <div class="pet-menu-item" id="pet-mi-close">关闭桌面宠物</div>
    <div class="pet-menu-sep"></div>
    <div class="pet-scales"></div>
  </div>
</div>
<script src="/sprite-pet.js"></script>
</body>
</html>
